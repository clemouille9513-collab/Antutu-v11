name: Compiler l'APK

on:
  workflow_dispatch:
  push:
    branches: [ test-telephone ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compiler
        run: gradle assembleDebug --no-daemon
      - name: Envoyer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: TestTelephone-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publier l'APK sur la branche apk
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk out/TestTelephone.apk
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add TestTelephone.apk
          git commit -q -m "APK compilé"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
